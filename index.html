<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew Wang — Resume</title>
<style>
:root {
  --primary: #0066cc;
  --secondary: #6b21e8;
  --accent: #e53e3e;
  --bg: #f5f7fa;
  --bg3: #ffffff;
  --text: #1a1a2e;
  --text-dim: #5a6480;
  --border: rgba(0,102,204,0.15);
  --glow: 0 4px 24px rgba(0,102,204,0.12);
}
[data-theme="dark"] {
  --primary: #00d4ff;
  --secondary: #7b2ff7;
  --bg: #0a0a0f;
  --bg3: #1a1a28;
  --text: #e8e8f0;
  --text-dim: #8888aa;
  --border: rgba(0,212,255,0.15);
  --glow: 0 0 20px rgba(0,212,255,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow-x:hidden; line-height:1.6; transition:background .3s,color .3s; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 20% 20%,rgba(107,33,232,.05) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,102,204,.05) 0%,transparent 50%); pointer-events:none; z-index:0; }
body::after { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,102,204,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,102,204,.04) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; z-index:0; }
[data-theme="dark"] body::before { background:radial-gradient(ellipse at 20% 20%,rgba(123,47,247,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,212,255,.06) 0%,transparent 50%); }
[data-theme="dark"] body::after { background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px); background-size:60px 60px; }
.container { max-width:1000px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }

/* Toolbar */
.toolbar { position:fixed; top:20px; right:20px; z-index:1000; display:flex; gap:8px; }
.toolbar-btn { display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:50px; border:1px solid var(--border); background:var(--bg3); color:var(--text); font-size:13px; font-weight:500; cursor:pointer; transition:all .25s; box-shadow:0 2px 12px rgba(0,0,0,.08); }
.toolbar-btn:hover { border-color:var(--primary); color:var(--primary); box-shadow:var(--glow); }

/* Hero */
.hero { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:60px 24px; position:relative; }
.hero-inner { max-width:700px; }
.hero-badge { display:inline-block; background:linear-gradient(135deg,rgba(0,102,204,.1),rgba(107,33,232,.1)); border:1px solid rgba(0,102,204,.3); border-radius:50px; padding:6px 20px; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--primary); margin-bottom:28px; opacity:0; animation:fadeUp .8s ease .2s forwards; }
.hero-name { font-size:clamp(42px,8vw,80px); font-weight:800; line-height:1.1; background:linear-gradient(135deg,#1a1a2e 0%,var(--primary) 50%,var(--secondary) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; opacity:0; animation:fadeUp .8s ease .4s forwards; margin-bottom:8px; }
[data-theme="dark"] .hero-name { background:linear-gradient(135deg,#fff 0%,var(--primary) 50%,var(--secondary) 100%); -webkit-background-clip:text; background-clip:text; }
.hero-name-cn { font-size:clamp(18px,3vw,28px); font-weight:300; color:var(--text-dim); opacity:0; animation:fadeUp .8s ease .5s forwards; margin-bottom:24px; }
.hero-subtitle { font-size:clamp(15px,2.5vw,20px); color:var(--primary); font-weight:400; opacity:0; animation:fadeUp .8s ease .6s forwards; margin-bottom:32px; }
.hero-contacts { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; opacity:0; animation:fadeUp .8s ease .8s forwards; }
.contact-item { color:var(--text-dim); font-size:14px; padding:8px 16px; border:1px solid rgba(0,0,0,.08); border-radius:8px; background:rgba(0,0,0,.02); transition:all .3s; }
[data-theme="dark"] .contact-item { border-color:rgba(255,255,255,.08); background:rgba(255,255,255,.03); }
.contact-item:hover { border-color:var(--primary); color:var(--primary); }
.scroll-hint { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text-dim); font-size:12px; letter-spacing:2px; opacity:0; animation:fadeIn 1s ease 1.5s forwards; }
.scroll-arrow { width:20px; height:20px; border-right:2px solid var(--primary); border-bottom:2px solid var(--primary); transform:rotate(45deg); animation:bounce 1.5s ease infinite; }

/* Section */
section { padding:80px 0; }
.section-header { display:flex; align-items:center; gap:16px; margin-bottom:48px; }
.section-number { font-size:12px; color:var(--primary); letter-spacing:3px; font-weight:600; }
.section-title { font-size:clamp(22px,4vw,34px); font-weight:700; background:linear-gradient(135deg,#1a1a2e,var(--text-dim)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
[data-theme="dark"] .section-title { background:linear-gradient(135deg,#fff,var(--text-dim)); -webkit-background-clip:text; background-clip:text; }
.section-line { flex:1; height:1px; background:linear-gradient(90deg,rgba(0,102,204,.4),transparent); }

/* Stats */
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:20px; margin-bottom:60px; }
.stat-card { background:var(--bg3); border:1px solid var(--border); border-radius:16px; padding:28px 20px; text-align:center; opacity:0; transform:scale(.9); transition:all .5s; box-shadow:0 2px 12px rgba(0,0,0,.06); }
.stat-card.visible { opacity:1; transform:scale(1); }
.stat-card:hover { border-color:var(--primary); box-shadow:var(--glow); }
.stat-number { font-size:42px; font-weight:800; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; margin-bottom:8px; }
.stat-label { font-size:12px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }
.stat-card:nth-child(1){transition-delay:.0s}.stat-card:nth-child(2){transition-delay:.1s}
.stat-card:nth-child(3){transition-delay:.2s}.stat-card:nth-child(4){transition-delay:.3s}

/* Skills grid */
.skills-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }

/* ===== FLIP CARD (skills) ===== */
.flip-card { perspective:1000px; opacity:0; transform:translateY(30px); transition:opacity .5s, transform .5s; }
.flip-card.visible { opacity:1; transform:translateY(0); }
.flip-card:nth-child(1){transition-delay:.0s}.flip-card:nth-child(2){transition-delay:.1s}
.flip-card:nth-child(3){transition-delay:.2s}.flip-card:nth-child(4){transition-delay:.3s}
.flip-card:nth-child(5){transition-delay:.4s}.flip-card:nth-child(6){transition-delay:.5s}
.flip-card-inner { position:relative; width:100%; transition:transform .65s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
.flip-card.flipping .flip-card-inner { transform:rotateY(180deg); }
.flip-card-front, .flip-card-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--bg3); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); transition:border-color .3s,box-shadow .3s; }
.flip-card-back { position:absolute; top:0; left:0; width:100%; height:100%; transform:rotateY(180deg); display:flex; align-items:center; justify-content:center; }
.flip-card:hover .flip-card-front, .flip-card:hover .flip-card-back { border-color:var(--primary); box-shadow:var(--glow); }
.skill-icon { font-size:28px; margin-bottom:12px; }
.skill-card-name { font-size:15px; font-weight:600; color:var(--primary); margin-bottom:8px; }
.skill-card-desc { font-size:13px; color:var(--text-dim); line-height:1.6; }
.flip-card-back .skill-card-desc { text-align:center; font-size:14px; }

/* Timeline */
.timeline { position:relative; padding-left:32px; }
.timeline::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:linear-gradient(180deg,var(--primary),var(--secondary),transparent); }
.timeline-item { position:relative; margin-bottom:48px; opacity:0; transform:translateX(-20px); transition:opacity .6s, transform .6s; }
.timeline-item.visible { opacity:1; transform:translateX(0); }
.timeline-dot { position:absolute; left:-39px; top:6px; width:14px; height:14px; border-radius:50%; background:var(--primary); border:2px solid var(--bg); box-shadow:0 0 10px var(--primary); animation:pulse 2s ease infinite; }

/* ===== FLIP CARD (timeline) ===== */
.tl-flip { perspective:1200px; }
.tl-flip-inner { position:relative; transition:transform .65s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
.tl-flip.flipping .tl-flip-inner { transform:rotateY(180deg); }
.tl-front, .tl-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--bg3); border:1px solid var(--border); border-radius:16px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.06); transition:border-color .3s,box-shadow .3s; }
.tl-back { position:absolute; top:0; left:0; width:100%; min-height:100%; transform:rotateY(180deg); display:flex; align-items:center; padding:28px; }
.tl-flip:hover .tl-front, .tl-flip:hover .tl-back { border-color:rgba(0,102,204,.4); box-shadow:var(--glow); }
[data-theme="dark"] .tl-flip:hover .tl-front, [data-theme="dark"] .tl-flip:hover .tl-back { border-color:rgba(0,212,255,.4); }
.tl-meta { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.tl-company { font-size:13px; font-weight:600; color:var(--primary); background:rgba(0,102,204,.1); padding:3px 12px; border-radius:20px; border:1px solid rgba(0,102,204,.2); }
[data-theme="dark"] .tl-company { background:rgba(0,212,255,.1); border-color:rgba(0,212,255,.2); }
.tl-period { font-size:12px; color:var(--text-dim); letter-spacing:1px; }
.tl-title { font-size:18px; font-weight:700; color:var(--text); margin-bottom:10px; }
.tl-desc { font-size:14px; color:var(--text-dim); line-height:1.7; margin-bottom:14px; }
.tl-back .tl-desc { margin-bottom:0; }
.tech-tags { display:flex; flex-wrap:wrap; gap:8px; }
.tag { font-size:11px; padding:4px 12px; border-radius:20px; font-weight:500; }
.tag-platform { background:rgba(123,47,247,.1); border:1px solid rgba(123,47,247,.25); color:#7b2ff7; }
[data-theme="dark"] .tag-platform { color:#b57bff; }
.tag-lang { background:rgba(0,102,204,.1); border:1px solid rgba(0,102,204,.2); color:var(--primary); }
.tag-framework { background:rgba(229,62,62,.08); border:1px solid rgba(229,62,62,.2); color:var(--accent); }

/* Education */
.edu-card { background:var(--bg3); border:1px solid var(--border); border-radius:16px; padding:32px; display:flex; align-items:center; gap:24px; opacity:0; transform:translateY(20px); transition:all .6s; box-shadow:0 2px 12px rgba(0,0,0,.06); }
.edu-card.visible { opacity:1; transform:translateY(0); }
.edu-icon { font-size:48px; flex-shrink:0; }
.edu-school { font-size:20px; font-weight:700; color:var(--text); margin-bottom:6px; }
.edu-detail { color:var(--text-dim); font-size:14px; }

footer { text-align:center; padding:60px 24px; color:var(--text-dim); font-size:13px; border-top:1px solid rgba(0,0,0,.06); }
[data-theme="dark"] footer { border-top-color:rgba(255,255,255,.05); }
footer span { color:var(--primary); }

@keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes bounce { 0%,100%{transform:rotate(45deg) translateY(0)} 50%{transform:rotate(45deg) translateY(6px)} }
@keyframes pulse { 0%,100%{box-shadow:0 0 6px var(--primary)} 50%{box-shadow:0 0 14px var(--primary),0 0 28px rgba(0,102,204,.25)} }
</style>
</head>
<body>

<div class="toolbar">
  <button class="toolbar-btn" onclick="toggleLang()">🌐 <span id="langLabel">中文</span></button>
  <button class="toolbar-btn" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span></button>
</div>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-badge" id="hero-badge"></div>
    <h1 class="hero-name">Andrew Wang</h1>
    <div class="hero-name-cn">汪奇伟</div>
    <div class="hero-subtitle" id="hero-subtitle"></div>
    <div class="hero-contacts" id="hero-contacts"></div>
  </div>
  <div class="scroll-hint"><span id="scroll-text">SCROLL</span><div class="scroll-arrow"></div></div>
</section>

<div class="container">
  <div class="stats-row" id="stats-row"></div>
</div>

<section><div class="container">
  <div class="section-header">
    <span class="section-number">01</span>
    <h2 class="section-title" id="sec-skills-title"></h2>
    <div class="section-line"></div>
  </div>
  <div class="skills-grid" id="skills-grid"></div>
</div></section>

<section><div class="container">
  <div class="section-header">
    <span class="section-number">02</span>
    <h2 class="section-title" id="sec-projects-title"></h2>
    <div class="section-line"></div>
  </div>
  <div class="timeline" id="projects-timeline"></div>
</div></section>

<section><div class="container">
  <div class="section-header">
    <span class="section-number">03</span>
    <h2 class="section-title" id="sec-early-title"></h2>
    <div class="section-line"></div>
  </div>
  <div class="timeline" id="early-timeline"></div>
</div></section>

<section><div class="container">
  <div class="section-header">
    <span class="section-number">04</span>
    <h2 class="section-title" id="sec-edu-title"></h2>
    <div class="section-line"></div>
  </div>
  <div class="edu-card" id="edu-card">
    <div class="edu-icon">🎓</div>
    <div>
      <div class="edu-school" id="edu-school"></div>
      <div class="edu-detail" id="edu-detail"></div>
    </div>
  </div>
</div></section>

<footer><p id="footer-text"></p></footer>

<script src="i18n.js"></script>
<script>
const SKILL_ICONS = ['📱','🌐','🔐','🤖','🏗️','🌍'];
const PLATFORM_TAGS = new Set(['iOS','Android','Web','Frontend','MTK','BREW','CDMA','Feature Phone','ESIM RapidPlus','React Native']);
const LANG_TAGS = new Set(['Dart','Swift','Objective-C','Java','TypeScript','JavaScript','C/C++','Vue']);

const LABELS = {
  en: { badge:'Full-Stack Mobile Engineer',
        subtitle:'15+ Years · Flutter · iOS · React Native · AI-Driven Development',
        scroll:'SCROLL', skills:'Core Skills', projects:'Project Experience',
        early:'Early Career', edu:'Education',
        footer:'15+ Years Full-Stack Mobile Engineer' },
  zh: { badge:'全栈移动端工程师',
        subtitle:'15年以上 · Flutter · iOS · React Native · AI驱动开发',
        scroll:'滚动', skills:'核心技能', projects:'项目经历',
        early:'早期经历', edu:'教育背景',
        footer:'15年以上全栈移动端工程师' }
};
const STATS = {
  en: [{n:'15+',l:'Years Experience'},{n:'13',l:'Major Projects'},{n:'6',l:'Companies'},{n:'8+',l:'Tech Stacks'}],
  zh: [{n:'15+',l:'年从业经验'},{n:'13',l:'重点项目'},{n:'6',l:'就职公司'},{n:'8+',l:'技术栈'}]
};

function tagClass(t) {
  if (LANG_TAGS.has(t)) return 'tag-lang';
  if (PLATFORM_TAGS.has(t)) return 'tag-platform';
  return 'tag-framework';
}
function tagsHtml(tags) {
  return tags.map(t => `<span class="tag ${tagClass(t)}">${t}</span>`).join('');
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let currentLang = 'en';
let initialized = false;

function renderAll(lang, animate) {
  const d = I18N[lang];
  const L = LABELS[lang];
  const S = STATS[lang];

  document.getElementById('hero-badge').textContent = L.badge;
  document.getElementById('hero-subtitle').textContent = L.subtitle;
  document.getElementById('scroll-text').textContent = L.scroll;
  document.getElementById('hero-contacts').innerHTML =
    d.contacts.map(c => `<div class="contact-item">${esc(c)}</div>`).join('');

  document.getElementById('stats-row').innerHTML = S.map((s,i) =>
    `<div class="stat-card" style="transition-delay:${i*0.1}s">
      <div class="stat-number">${s.n}</div>
      <div class="stat-label">${s.l}</div>
    </div>`).join('');

  document.getElementById('sec-skills-title').textContent = L.skills;
  document.getElementById('sec-projects-title').textContent = L.projects;
  document.getElementById('sec-early-title').textContent = L.early;
  document.getElementById('sec-edu-title').textContent = L.edu;

  document.getElementById('skills-grid').innerHTML = d.skills.map((s,i) =>
    `<div class="flip-card" style="transition-delay:${i*0.1}s">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <div class="skill-icon">${SKILL_ICONS[i]||'⚡'}</div>
          <div class="skill-card-name">${esc(s.name)}</div>
          <div class="skill-card-desc">${esc(s.desc)}</div>
        </div>
        <div class="flip-card-back">
          <div class="skill-card-desc">${esc(s.desc)}</div>
        </div>
      </div>
    </div>`).join('');

  function tlHtml(items) {
    return items.map(item =>
      `<div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="tl-flip">
          <div class="tl-flip-inner">
            <div class="tl-front">
              <div class="tl-meta">
                <span class="tl-company">${esc(item.company)}</span>
                <span class="tl-period">${esc(item.period)}</span>
              </div>
              <div class="tl-title">${esc(item.title)}</div>
              <div class="tl-desc">${esc(item.desc)}</div>
              <div class="tech-tags">${tagsHtml(item.tags)}</div>
            </div>
            <div class="tl-back">
              <div class="tl-desc">${esc(item.desc)}</div>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  document.getElementById('projects-timeline').innerHTML = tlHtml(d.projects);
  document.getElementById('early-timeline').innerHTML = tlHtml(d.early);

  document.getElementById('edu-school').textContent = d.education.school;
  document.getElementById('edu-detail').textContent = d.education.detail;
  document.getElementById('footer-text').innerHTML =
    `Andrew Wang 汪奇伟 &nbsp;·&nbsp; <span>${L.footer}</span> &nbsp;·&nbsp; IBM · Flutter · iOS · React Native`;

  setupObservers();
}

function setupObservers() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.flip-card:not(.visible), .timeline-item:not(.visible), .stat-card:not(.visible), #edu-card:not(.visible)')
    .forEach(el => obs.observe(el));

  const cObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target.querySelector('.stat-number');
      const num = parseInt(el.textContent), suf = el.textContent.replace(/[0-9]/g,'');
      let s = 0;
      const step = ts => {
        if (!s) s = ts;
        const p = Math.min((ts-s)/1500,1), ease = 1-Math.pow(1-p,3);
        el.textContent = Math.floor(ease*num)+suf;
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      cObs.unobserve(e.target);
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.stat-card').forEach(el => cObs.observe(el));
}

// Language toggle: flip all cards, swap content at midpoint
function toggleLang() {
  const newLang = currentLang === 'en' ? 'zh' : 'en';
  document.getElementById('langLabel').textContent = newLang === 'en' ? '中文' : 'English';

  // Add flipping class to all flip targets
  const allFlips = document.querySelectorAll('.flip-card, .tl-flip');
  allFlips.forEach(el => el.classList.add('flipping'));

  // At midpoint of animation, swap content
  setTimeout(() => {
    currentLang = newLang;
    renderAll(currentLang);
    // Re-mark already-visible items as visible immediately
    document.querySelectorAll('.flip-card, .timeline-item, .stat-card, #edu-card').forEach(el => {
      el.classList.add('visible');
    });
    // Remove flipping after full animation
    setTimeout(() => {
      document.querySelectorAll('.flip-card, .tl-flip').forEach(el => el.classList.remove('flipping'));
    }, 350);
  }, 325);
}

// Theme toggle
let theme = 'light';
function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
  document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = theme === 'dark' ? 'Light' : 'Dark';
}

// Init
renderAll('en');
</script>
</body>
</html>
