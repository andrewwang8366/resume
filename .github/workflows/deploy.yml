name: Build & Deploy Resume

on:
  push:
    branches: [main]
    paths: [resume.en.md, resume.zh.md, build.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build i18n.js from markdown files
        run: python3 build.py

      - name: Commit generated i18n.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add i18n.js
          git diff --cached --quiet || git commit -m "chore: rebuild i18n.js"
          git push
