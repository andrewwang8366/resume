name: Build & Deploy Resume

on:
  push:
    branches: [main]
    paths: [resume.md, build.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from resume.md
        run: python3 build.py

      - name: Commit generated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: rebuild index.html from resume.md"
          git push
